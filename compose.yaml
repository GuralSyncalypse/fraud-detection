name: financial-fraud-detection

x-hadoop-common: &hadoop-common
  build:
    context: .
    dockerfile: docker/hadoop/Dockerfile
  image: financial-fraud/hadoop:3.4.3
  restart: unless-stopped
  networks:
    - fraud-network

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  image: financial-fraud/spark-jupyter:3.5.9
  restart: unless-stopped
  networks:
    - fraud-network

services:
  namenode:
    <<: *hadoop-common
    hostname: namenode
    command: ["/opt/project/start-namenode.sh"]
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode-data:/data/name
      - ./data:/workspace/data:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -fs hdfs://namenode:8020 -safemode get >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  datanode-1:
    <<: *hadoop-common
    hostname: datanode-1
    command: ["/opt/project/start-datanode.sh"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9864:9864"
    volumes:
      - datanode-1-data:/data/data
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -fs hdfs://namenode:8020 -report 2>/dev/null | grep -q 'Name:.*datanode-1'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  datanode-2:
    <<: *hadoop-common
    hostname: datanode-2
    command: ["/opt/project/start-datanode.sh"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "9865:9864"
    volumes:
      - datanode-2-data:/data/data
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -fs hdfs://namenode:8020 -report 2>/dev/null | grep -q 'Name:.*datanode-2'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  spark-master:
    <<: *spark-common
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  spark-worker-1:
    <<: *spark-common
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 1g
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spark-worker-2:
    <<: *spark-common
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 1g
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  jupyter:
    <<: *spark-common
    hostname: jupyter
    command: ["/opt/project/start-jupyter.sh"]
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-fraud-demo}
      SPARK_MASTER_URL: spark://spark-master:7077
      HDFS_URL: hdfs://namenode:8020
      PYSPARK_SUBMIT_ARGS: >-
        --master spark://spark-master:7077
        --conf spark.driver.host=jupyter
        --conf spark.driver.bindAddress=0.0.0.0
        pyspark-shell
    depends_on:
      namenode:
        condition: service_healthy
      datanode-1:
        condition: service_healthy
      datanode-2:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./output:/workspace/output
      - ./scripts:/workspace/scripts:ro
      - ./src:/workspace/src:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  stream-kafka:
    profiles: ["streaming"]
    image: apache/kafka:4.3.1
    hostname: stream-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://stream-kafka:19092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@stream-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - stream-kafka-data:/var/lib/kafka/data
    networks:
      - fraud-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server stream-kafka:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  flink-kafka-init:
    profiles: ["streaming"]
    image: apache/kafka:4.3.1
    depends_on:
      stream-kafka:
        condition: service_healthy
    networks:
      - fraud-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server stream-kafka:19092
        --create --if-not-exists --topic flink-transactions --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server stream-kafka:19092
        --create --if-not-exists --topic flink-alerts --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server stream-kafka:19092
        --create --if-not-exists --topic flink-ml-alerts --partitions 1 --replication-factor 1

  flink-jobmanager:
    profiles: ["streaming"]
    build:
      context: ./streaming/flink-job
    image: financial-fraud/flink-stream:1.20.2
    command: standalone-job --job-classname com.example.streaming.HighAmountJob
    ports:
      - "18082:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: stream-kafka:19092
      TRANSACTIONS_TOPIC: flink-transactions
      ALERTS_TOPIC: flink-alerts
      HIGH_AMOUNT_THRESHOLD: ${FLINK_HIGH_AMOUNT_THRESHOLD:-1000}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        state.checkpoints.dir: file:///flink-data/checkpoints
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: AT_LEAST_ONCE
    volumes:
      - flink-stream-state:/flink-data
    networks:
      - fraud-network
    depends_on:
      flink-kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  flink-taskmanager:
    profiles: ["streaming"]
    image: financial-fraud/flink-stream:1.20.2
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 1
    volumes:
      - flink-stream-state:/flink-data
    networks:
      - fraud-network
    depends_on:
      flink-jobmanager:
        condition: service_started

  flink-producer:
    profiles: ["streaming"]
    build:
      context: ./streaming/producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: stream-kafka:19092
      TRANSACTIONS_TOPIC: flink-transactions
      TRANSACTIONS_PER_SECOND: ${FLINK_TRANSACTIONS_PER_SECOND:-1}
    networks:
      - fraud-network
    depends_on:
      flink-kafka-init:
        condition: service_completed_successfully

  flink-ml-scorer:
    profiles: ["streaming"]
    <<: *spark-common
    hostname: flink-ml-scorer
    command: ["python3", "/workspace/streaming/ml-scorer/scorer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: stream-kafka:19092
      TRANSACTIONS_TOPIC: flink-transactions
      ML_ALERTS_TOPIC: flink-ml-alerts
      ML_ANOMALY_SCORE_MIN: ${ML_ANOMALY_SCORE_MIN:-0.05}
      ISOLATION_MODEL_PATH: /workspace/output/models/isolation_forest.joblib
    volumes:
      - ./streaming/ml-scorer:/workspace/streaming/ml-scorer:ro
      - ./output/models:/workspace/output/models:ro
    depends_on:
      flink-kafka-init:
        condition: service_completed_successfully

  dashboard:
    <<: *spark-common
    hostname: dashboard
    command: ["python3", "/workspace/dashboard/server.py", "--host", "0.0.0.0", "--port", "8501", "--output", "/workspace/output"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: stream-kafka:19092
      FLINK_ALERTS_TOPIC: flink-alerts
      FLINK_HIGH_AMOUNT_THRESHOLD: ${FLINK_HIGH_AMOUNT_THRESHOLD:-1000}
      ML_ALERTS_TOPIC: flink-ml-alerts
      ML_ANOMALY_SCORE_MIN: ${ML_ANOMALY_SCORE_MIN:-0.05}
      ISOLATION_MODEL_PATH: /workspace/output/models/isolation_forest.joblib
    ports:
      - "8501:8501"
    depends_on:
      namenode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    volumes:
      - ./dashboard:/workspace/dashboard:ro
      - ./output:/workspace/output:ro
      - ./src:/workspace/src:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  fraud-network:
    name: financial-fraud-network
    driver: bridge

volumes:
  namenode-data:
    name: financial-fraud-namenode-data
  datanode-1-data:
    name: financial-fraud-datanode-1-data
  datanode-2-data:
    name: financial-fraud-datanode-2-data
  stream-kafka-data:
    name: financial-fraud-stream-kafka-data
  flink-stream-state:
    name: financial-fraud-flink-stream-state
